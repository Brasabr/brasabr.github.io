<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e54c14">
  <title>Baixar BrasaBr para Android</title>
  <link rel="icon" href="/favicon-32.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(160deg,#fff7ec,#f7e4cd);color:#1a1008;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(460px,100%);padding:30px 24px;border:1px solid #ebd6bf;border-radius:26px;background:#fff;box-shadow:0 18px 50px rgba(75,37,16,.14);text-align:center}.logo{width:88px;height:88px;border-radius:22px;background:#140e0a}.tag{display:inline-block;margin-top:18px;padding:5px 10px;border-radius:999px;background:#fff2e3;color:#a9320b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}h1{margin:14px 0 8px;font-size:30px;line-height:1.05}p{color:#765f4c;line-height:1.5}.spinner{width:40px;height:40px;margin:20px auto;border:4px solid #f3d6ba;border-top-color:#e54c14;border-radius:50%;animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:12px;padding:12px 18px;border-radius:999px;background:linear-gradient(#ff6a2a,#e54c14);color:#fff;text-decoration:none;font-weight:900}.btn.alt{background:#fff;color:#1a1008;border:1px solid #ebd6bf}.small{font-size:12px}.error{color:#a9320b;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-512.png" width="88" height="88" alt="BrasaBr">
    <span class="tag">Aplicativo Android</span>
    <h1>Preparando o APK mais recente…</h1>
    <p id="status">Estamos localizando automaticamente a última versão publicada.</p>
    <div class="spinner" id="spinner" aria-label="Carregando"></div>
    <a class="btn" id="download" href="https://github.com/Brasabr/brasabr.github.io/releases/latest" hidden>⬇ Baixar APK</a>
    <a class="btn alt" href="/">Voltar ao site</a>
    <p class="small">O Android poderá solicitar autorização para instalar aplicativos desconhecidos.</p>
  </main>
  <script>
    (() => {
      const api = 'https://api.github.com/repos/Brasabr/brasabr.github.io/releases/latest';
      const status = document.getElementById('status');
      const spinner = document.getElementById('spinner');
      const button = document.getElementById('download');
      fetch(api, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('release indisponível');
          return response.json();
        })
        .then((release) => {
          const assets = Array.isArray(release.assets) ? release.assets : [];
          const exact = assets.find((asset) => asset.name === 'BrasaBr-comentarios-alinhados.apk');
          const compatible = assets.find((asset) => /^BrasaBr-comentarios-alinhados.*\.apk$/i.test(asset.name));
          const anyApk = assets.find((asset) => /\.apk$/i.test(asset.name));
          const apk = exact || compatible || anyApk;
          if (!apk || !apk.browser_download_url) throw new Error('APK não encontrado');
          status.textContent = `Versão ${release.tag_name || 'mais recente'} encontrada. O download vai começar.`;
          button.href = apk.browser_download_url;
          button.hidden = false;
          spinner.hidden = true;
          setTimeout(() => location.replace(apk.browser_download_url), 450);
        })
        .catch(() => {
          status.innerHTML = '<span class="error">Não foi possível iniciar automaticamente.</span><br>Abra a página da versão e toque no arquivo APK.';
          button.href = 'https://github.com/Brasabr/brasabr.github.io/releases/latest';
          button.textContent = 'Abrir página da versão';
          button.hidden = false;
          spinner.hidden = true;
        });
    })();
  </script>
</body>
</html>
